services:
  library:
    build: .
    image: library-app:lab3
    container_name: library-app
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      LOG_LEVEL: "INFO"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped